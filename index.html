
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sazvan Bakery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #faf6ef;
    color: #382719;
}

/* HEADER */
header {
    background: #382719;
    color: white;
    text-align: center;
    padding: 35px 15px;
}

.logo {
    font-family: Georgia, serif;
    font-size: 42px;
    letter-spacing: 5px;
}

header p {
    color: #e5cba7;
    letter-spacing: 3px;
    font-size: 12px;
    margin-top: 8px;
}

/* LANGUAGE */
.languages {
    text-align: center;
    padding: 15px;
}

.languages button {
    border: 1px solid #8c6745;
    background: transparent;
    color: #382719;
    padding: 8px 15px;
    margin: 3px;
    border-radius: 20px;
    cursor: pointer;
}

.languages button.active {
    background: #382719;
    color: white;
}

/* HERO */
.hero {
    text-align: center;
    padding: 35px 15px;
}

.hero h1 {
    font-family: Georgia, serif;
    font-size: 30px;
    margin-bottom: 12px;
}

.hero p {
    color: #806d5b;
}

/* SEARCH */
.search {
    display: block;
    width: 90%;
    max-width: 450px;
    padding: 13px;
    margin: 10px auto 25px;
    border: 1px solid #d6c4ac;
    border-radius: 8px;
    font-size: 15px;
    background: white;
}

/* CATEGORIES */
.categories {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 15px 25px;
}

.categories button {
    background: white;
    border: 1px solid #d6c4ac;
    color: #382719;
    padding: 10px 18px;
    border-radius: 25px;
    cursor: pointer;
}

.categories button.active,
.categories button:hover {
    background: #382719;
    color: white;
}

/* PRODUCTS */
.menu {
    max-width: 1100px;
    margin: auto;
    padding: 10px 20px 50px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
}

.product {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px #00000010;
    transition: 0.3s;
}

.product:hover {
    transform: translateY(-5px);
}

.product img {
    width: 100%;
    height: 190px;
    object-fit: cover;
}

.product-info {
    padding: 17px;
}

.product-info h3 {
    font-family: Georgia, serif;
    font-size: 20px;
    margin-bottom: 8px;
}

.product-info p {
    color: #887866;
    font-size: 13px;
    margin-bottom: 15px;
    line-height: 1.5;
}

.price {
    color: #9b6838;
    font-size: 17px;
    font-weight: bold;
}

/* FOOTER */
footer {
    background: #382719;
    color: white;
    text-align: center;
    padding: 30px 15px;
}

footer h2 {
    font-family: Georgia, serif;
    letter-spacing: 3px;
    margin-bottom: 12px;
}

footer p {
    color: #e5cba7;
    font-size: 13px;
    line-height: 1.8;
}

.no-results {
    text-align: center;
    grid-column: 1 / -1;
    padding: 30px;
    color: #806d5b;
}
</style>
</head>

<body>

<header>
    <div class="logo">SAZVAN</div>
    <p>BAKERY & SWEETS</p>
</header>

<div class="languages">
    <button class="active" onclick="changeLanguage('en', this)">English</button>
    <button onclick="changeLanguage('ar', this)">العربية</button>
    <button onclick="changeLanguage('ku', this)">کوردی</button>
</div>

<section class="hero">
    <h1 id="welcome">Freshly Baked, Made with Love</h1>
    <p id="subtitle">Discover our delicious bakery collection.</p>
</section>

<input
    type="text"
    class="search"
    id="search"
    placeholder="Search products..."
    oninput="displayProducts()"
>

<div class="categories" id="categories">
    <button class="active" onclick="filterProducts('all', this)">All</button>
    <button onclick="filterProducts('bread', this)">Bread</button>
    <button onclick="filterProducts('cake', this)">Cakes</button>
    <button onclick="filterProducts('pastry', this)">Pastries</button>
    <button onclick="filterProducts('cookies', this)">Cookies</button>
</div>

<main class="menu" id="menu"></main>

<footer>
    <h2>SAZVAN</h2>
    <p id="footerText">
        Thank you for visiting us!<br>
        Freshness in every bite.
    </p>
    <p>© 2026 Sazvan Bakery</p>
</footer>

<script>

// PRODUCT DATABASE
// Change product names, descriptions and prices here.

const products = [
    {
        name: {
            en: "Chocolate Cake",
            ar: "كيكة الشوكولاتة",
            ku: "کێکی چۆکڵێت"
        },
        description: {
            en: "Rich chocolate cake with creamy frosting.",
            ar: "كيكة شوكولاتة غنية بالكريمة.",
            ku: "کێکی چۆکڵێت لەگەڵ کرێمی خۆش"
        },
        price: 12000,
        category: "cake",
        image: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600"
    },
    {
        name: {
            en: "Fresh Croissant",
            ar: "كرواسون طازج",
            ku: "کرواسانی تازە"
        },
        description: {
            en: "Buttery and crispy French croissant.",
            ar: "كرواسون فرنسي مقرمش بالزبدة.",
            ku: "کرواسانێکی فەرەنسی بە کرێمی کرە"
        },
        price: 2500,
        category: "pastry",
        image: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=600"
    },
    {
        name: {
            en: "Chocolate Cookies",
            ar: "بسكويت الشوكولاتة",
            ku: "بیسکیتی چۆکڵێت"
        },
        description: {
            en: "Delicious cookies with chocolate chips.",
            ar: "بسكويت لذيذ مع قطع الشوكولاتة.",
            ku: "بیسکیتی خۆش بە پارچە چۆکڵێت"
        },
        price: 4000,
        category: "cookies",
        image: "https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=600"
    },
    {
        name: {
            en: "Fresh Bread",
            ar: "خبز طازج",
            ku: "نانێکی تازە"
        },
        description: {
            en: "Freshly baked traditional bread.",
            ar: "خبز طازج مخبوز يومياً.",
            ku: "نانی تازە کە ڕۆژانە دەبرژێت"
        },
        price: 1500,
        category: "bread",
        image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600"
    },
    {
        name: {
            en: "Strawberry Cupcake",
            ar: "كب كيك بالفراولة",
            ku: "کاپ کێکی تووت فرەنگی"
        },
        description: {
            en: "Soft cupcake topped with strawberry cream.",
            ar: "كب كيك طري مع كريمة الفراولة.",
            ku: "کاپ کێکی نەرم بە کرێمی تووت فرەنگی"
        },
        price: 3000,
        category: "cake",
        image: "https://images.unsplash.com/photo-1486427944299-d1955d23e34d?w=600"
    },
    {
        name: {
            en: "Butter Pastry",
            ar: "معجنات بالزبدة",
            ku: "شیرینی بە کرە"
        },
        description: {
            en: "Delicious golden buttery pastry.",
            ar: "معجنات ذهبية لذيذة بالزبدة.",
            ku: "شیرینییەکی زێڕینی بە تامی کرە"
        },
        price: 3500,
        category: "pastry",
        image: "https://images.unsplash.com/photo-1509365465985-25d11c17e812?w=600"
    }
];

// CURRENT SETTINGS
let currentCategory = "all";
let currentLanguage = "en";

// DISPLAY PRODUCTS
function displayProducts() {

    const menu = document.getElementById("menu");
    const search = document.getElementById("search").value.toLowerCase();

    menu.innerHTML = "";

    const filtered = products.filter(product => {

        const matchesCategory =
            currentCategory === "all" ||
            product.category === currentCategory;

        const matchesSearch =
            product.name[currentLanguage].toLowerCase().includes(search);

        return matchesCategory && matchesSearch;
    });

    if (filtered.length === 0) {
        menu.innerHTML = '<div class="no-results">No products found.</div>';
        return;
    }

    filtered.forEach(product => {

        menu.innerHTML += `
            <div class="product">
                <img src="${product.image}" alt="${product.name[currentLanguage]}">

                <div class="product-info">
                    <h3>${product.name[currentLanguage]}</h3>

                    <p>${product.description[currentLanguage]}</p>

                    <div class="price">
                        ${product.price.toLocaleString()} IQD
                    </div>
                </div>
            </div>
        `;
    });
}

// FILTER CATEGORIES
function filterProducts(category, button) {

    currentCategory = category;

    document.querySelectorAll(".categories button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    displayProducts();
}

// CHANGE LANGUAGE
function changeLanguage(language, button) {

    currentLanguage = language;

    document.querySelectorAll(".languages button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    const translations = {
        en: {
            welcome: "Freshly Baked, Made with Love",
            subtitle: "Discover our delicious bakery collection.",
            search: "Search products...",
            categories: ["All", "Bread", "Cakes", "Pastries", "Cookies"],
            footer: "Thank you for visiting us!<br>Freshness in every bite."
        },
        ar: {
            welcome: "مخبوزات طازجة، صنعت بكل حب",
            subtitle: "اكتشفوا مجموعتنا اللذيذة من المخبوزات.",
            search: "ابحث عن المنتجات...",
            categories: ["الكل", "خبز", "كيك", "معجنات", "بسكويت"],
            footer: "شكراً لزيارتكم!<br>الطعم الطازج في كل لقمة."
        },
        ku: {
            welcome: "بە خۆشەویستی دروستکراوە",
            subtitle: "کۆمەڵە شیرینی و نانە خۆشەکانمان ببینە.",
            search: "گەڕان بۆ بەرهەم...",
            categories: ["هەموو", "نان", "کێک", "شیرینی", "بیسکیت"],
            footer: "سوپاس بۆ سەردانتان!<br>تامی تازە لە هەر لقەمەیەکدا."
        }
    };

    const t = translations[language];

    document.getElementById("welcome").innerText = t.welcome;
    document.getElementById("subtitle").innerText = t.subtitle;
    document.getElementById("search").placeholder = t.search;
    document.getElementById("footerText").innerHTML = t.footer;

    document.querySelectorAll(".categories button").forEach((btn, i) => {
        btn.innerText = t.categories[i];
    });

    // Set text direction for Arabic
    document.body.dir = language === "ar" ? "rtl" : "ltr";

    displayProducts();
}

// INITIAL DISPLAY
displayProducts();

</script>

</body>
</html>
